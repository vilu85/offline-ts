# Publishes a verified package to npm and creates a matching GitHub Release.
name: Publish npm package

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout tagged source
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22.14'
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false
            - name: Install OIDC-compatible npm
              run: npm install --global npm@11.5.1
            - name: Verify tag and package version
              id: package
              shell: bash
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$VERSION" != "$TAG_VERSION" ]; then
                    echo "Tag version $TAG_VERSION does not match package version $VERSION"
                    exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
                    echo "Tagged commit must be part of master"
                    exit 1
                  fi
                  echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tarball=offline-ts-$VERSION.tgz" >> "$GITHUB_OUTPUT"
            - name: Install dependencies
              run: npm ci
            - name: Type check
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm test -- --runInBand
            - name: Pack release
              run: npm pack
            - name: Publish to npm with provenance
              shell: bash
              run: |
                  if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
                    echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published; skipping npm publish"
                  else
                    npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance
                  fi
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2.2.1
              with:
                  files: ${{ steps.package.outputs.tarball }}
                  generate_release_notes: true
                  make_latest: true
